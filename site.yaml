nombre: Talleres Arlanzón
eslogan: Mecánica, neumáticos y pre-ITV en Burgos. Te decimos el precio antes de tocar el coche.
sector: taller
logo: ""          # ruta a una imagen en public/ (p. ej. /logo.svg). Vacío = nombre en texto con marca naranja.
colores:
  primario: "#ff6b1a"   # naranja (botones, banda de marcas, cifras, franjas)
  acento: "#b8430b"     # naranja tostado (textos y detalles naranjas sobre fondo claro, foco)
  fondo: "#ffffff"
  texto: "#1f2226"      # gris carbón: la letra y también las bandas oscuras
contacto:
  telefono: "947 38 15 20"
  email: citas@talleresarlanzon.es
  direccion: Calle Alcalde Martín Cobos 18, 09007 Burgos (Burgos)
  horario: "Lunes a viernes, de 8:00 a 14:00 y de 15:30 a 19:30. Sábados, de 9:00 a 13:00."
  whatsapp: "+34 641 27 90 58"
redes:
  instagram: https://www.instagram.com/
  facebook: https://www.facebook.com/
  linkedin: ""
menu:
  - { texto: Servicios, url: "/#servicios" }
  - { texto: El taller, url: "/#sobre" }
  - { texto: Tarifas, url: "/#tarifas" }
  - { texto: Opiniones, url: "/#opiniones" }
  - { texto: Contacto, url: "/#contacto" }
boton_cabecera: { texto: Pedir cita, url: "/#cita" }
seo:
  titulo: Talleres Arlanzón · Taller mecánico y neumáticos en Burgos
  descripcion: "Taller mecánico multimarca en Burgos: revisiones, frenos, neumáticos, diagnosis, aire acondicionado y pre-ITV. Presupuesto antes de empezar."
  tipo: AutoRepair
marca_pie: true

secciones:
  hero:
    activa: true
    antetitulo: Taller multimarca en Burgos
    titulo: Tu coche, a punto y sin sorpresas
    texto: "Mecánica, neumáticos y electrónica para todas las marcas. Te llamamos con el presupuesto antes de empezar y lo cumplimos."
    imagen: /fotos/hero.jpg
    cta: { texto: Pedir cita, url: "/#cita" }
    cta_secundario: { texto: Llamar al taller, url: "tel:+34947381520" }

  servicios:
    activa: true
    antetitulo: Servicios
    titulo: Todo lo que necesita tu coche, en un solo taller
    texto: "Turismos, furgonetas, híbridos y eléctricos. Con recambio de primera marca y garantía por escrito."
    cta: { texto: Pide cita para tu coche, url: "/#cita" }
    items:
      - { titulo: Revisión y mantenimiento, texto: "Aceite, filtros y puntos de control según el libro del fabricante. Sin perder la garantía.", icono: llave }
      - { titulo: Frenos, texto: "Pastillas, discos, líquido y prueba en banco de frenos.", icono: freno }
      - { titulo: Neumáticos, texto: "Montaje, equilibrado, alineado y almacenaje de tus ruedas de invierno.", icono: rueda }
      - { titulo: Diagnosis electrónica, texto: "Leemos las averías de la centralita y te explicamos qué pasa.", icono: diagnosis }
      - { titulo: Aire acondicionado, texto: "Carga de gas, revisión de fugas y limpieza del circuito.", icono: copo }
      - { titulo: Distribución y embrague, texto: "Kits de distribución, bombas de agua y embragues completos.", icono: engranaje }
      - { titulo: Batería y arranque, texto: "Comprobación gratis de batería, alternador y motor de arranque.", icono: bateria }
      - { titulo: Pre-ITV, texto: "Repasamos el coche antes de la inspección y, si quieres, te lo llevamos.", icono: escudo }

  marcas:
    activa: true
    antetitulo: Multimarca
    titulo: Trabajamos todas las marcas
    texto: "Con los equipos de diagnosis y los datos técnicos de cada fabricante."
