      - { titulo: Dacia }
      - { titulo: Nissan }

  sobre:
    activa: true
    antetitulo: El taller
    titulo: Treinta años arreglando coches en Gamonal
    texto: "Empezó el abuelo con un foso y dos llaves inglesas. Hoy somos cinco mecánicos con elevadores, banco de frenos y equipos de diagnosis para coches de cualquier año.\n\nLo que no ha cambiado es la forma de trabajar: te enseñamos la pieza que cambiamos y no hacemos nada que no hayas aprobado antes."
    imagen: /fotos/taller.jpg
    galeria:
      - /fotos/galeria-1.jpg
      - /fotos/galeria-2.jpg
      - /fotos/galeria-3.jpg
      - /fotos/galeria-4.jpg
    items:
      - { titulo: Presupuesto antes de empezar, icono: euro }
      - { titulo: Garantía por escrito, icono: escudo }
      - { titulo: Coche de cortesía, icono: coche }
      - { titulo: Recambio de primera marca, icono: engranaje }
    cta: { texto: Ven a conocernos, url: "/#contacto" }

  cita:
    activa: true
    antetitulo: Cita previa
    titulo: Reserva tu hueco en el taller
    texto: "Dinos qué coche es y qué le pasa. Te confirmamos el día y la hora por teléfono o WhatsApp."
    imagen: /fotos/cita.jpg
    nota: "Sin compromiso. Te contestamos el mismo día laborable."
    boton_formulario: Pedir cita
    items:
      - { titulo: Elige el día, texto: "Pon la fecha que te venga bien y te la confirmamos.", icono: calendario }
      - { titulo: Trae el coche, texto: "Lo miramos delante de ti si quieres y te decimos qué tiene.", icono: coche }
      - { titulo: Te llamamos con el precio, texto: "No tocamos nada hasta que nos digas que sí.", icono: telefono }

  tarifas:
    activa: true
    antetitulo: Tarifas
    titulo: Precios claros, sin letra pequeña
    texto: "Precios orientativos con IVA para un turismo medio. Te damos el precio exacto de tu coche antes de empezar."
    nota: "Mano de obra y piezas incluidas salvo que se indique."
    tarifas:
      - { nombre: Cambio de aceite y filtro, texto: "Aceite según fabricante hasta 5 litros.", precio: "desde 69 €", categoria: Mantenimiento }
      - { nombre: Revisión completa, texto: "Aceite, cuatro filtros y 40 puntos de control.", precio: "desde 149 €", categoria: Mantenimiento }
      - { nombre: Pre-ITV, texto: "Luces, frenos, holguras, emisiones y neumáticos.", precio: "25 €", categoria: Mantenimiento }
      - { nombre: Pastillas delanteras, texto: "Montaje y prueba en banco de frenos.", precio: "desde 89 €", categoria: Frenos y ruedas }
      - { nombre: Montaje y equilibrado, texto: "Por rueda, con válvula nueva.", precio: "12 €", categoria: Frenos y ruedas }
      - { nombre: Alineado de dirección, texto: "Con informe impreso antes y después.", precio: "45 €", categoria: Frenos y ruedas }
      - { nombre: Diagnosis electrónica, texto: "Lectura y borrado de averías con informe.", precio: "35 €", categoria: Electrónica y clima }
      - { nombre: Carga de aire acondicionado, texto: "Gas, aceite y prueba de fugas.", precio: "desde 79 €", categoria: Electrónica y clima }
      - { nombre: Prueba de batería, texto: "Batería, alternador y arranque.", precio: "Gratis", categoria: Electrónica y clima }

  cifras:
    activa: true
    antetitulo: En números
    titulo: Oficio de toda la vida
    items:
      - { titulo: "30", texto: años en Burgos }
      - { titulo: "+4.000", texto: coches con ficha en el taller }
      - { titulo: "5", texto: mecánicos titulados }
      - { titulo: "1 año", texto: de garantía en reparaciones }

  opiniones:
    activa: true
    antetitulo: Opiniones
    titulo: Lo que dicen al recoger el coche
    testimonios:
      - { texto: "Me llamaron con el presupuesto antes de tocar nada y al final pagué lo que me dijeron. Así da gusto.", autor: Begoña M., nota: "Revisión y frenos, Gamonal" }
      - { texto: "El coche no arrancaba un lunes a primera hora y a mediodía ya lo tenía. Me enseñaron la pieza vieja.", autor: Óscar R., nota: "Motor de arranque, Villimar" }
      - { texto: "Llevo la furgoneta del trabajo desde hace años. Serios, rápidos y te explican las cosas claras.", autor: Luis Á., nota: "Mantenimiento de furgoneta, Burgos" }

  preguntas:
    activa: true
    antetitulo: Preguntas frecuentes
    titulo: Lo que nos preguntáis en el mostrador
    texto: "¿No encuentras la tuya? Llámanos y te lo contamos."
    preguntas:
      - { pregunta: "¿Pierdo la garantía del fabricante si hago la revisión aquí?", respuesta: "No. Seguimos el plan de mantenimiento del fabricante, usamos piezas de calidad equivalente y sellamos el libro de revisiones." }
      - { pregunta: "¿Me dais el presupuesto antes de reparar?", respuesta: "Siempre. Miramos el coche, te llamamos con el precio cerrado y no empezamos hasta que nos digas que sí." }
      - { pregunta: "¿Tenéis coche de sustitución?", respuesta: "Sí, para reparaciones de más de un día tenemos coche de cortesía. Pídelo al reservar la cita." }
      - { pregunta: "¿Trabajáis con coches híbridos y eléctricos?", respuesta: "Sí. Tenemos mecánicos formados en alta tensión y los equipos de diagnosis necesarios para su mantenimiento." }
      - { pregunta: "¿Me lleváis el coche a pasar la ITV?", respuesta: "Hacemos la pre-ITV y, si quieres, te lo llevamos a la estación y te lo devolvemos con la pegatina." }

  contacto:
    activa: true
    antetitulo: Contacto
    titulo: Pásate por el taller
    texto: "En el polígono de Gamonal, con aparcamiento en la puerta. Si no puedes venir, te recogemos el coche."
    imagen: /fotos/contacto.jpg
